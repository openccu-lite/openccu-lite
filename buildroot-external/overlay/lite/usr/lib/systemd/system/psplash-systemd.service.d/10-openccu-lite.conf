# openccu-lite: the progress helper only where the boot splash can run.
#
# psplash-systemd is bound to psplash-start (BindsTo=), which is skipped without a framebuffer
# (its drop-in). Bound to a skipped unit, the helper's start job failed at every boot of a system
# without a display - "Dependency failed for Start psplash-systemd progress communication helper",
# a warning in a journal that had nothing wrong. With the same condition it is skipped like the
# splash: systemd tests a unit's conditions before it looks at the units it is bound to.
#
# A framebuffer that appears later starts both through udev (62-openccu-lite-psplash.rules).
[Unit]
ConditionPathExists=/dev/fb0
