# openccu-lite: the system's own fixed ports that lie in the kernel's ephemeral range
# (net.ipv4.ip_local_port_range, 32768-60999). The kernel picks the local port of every outgoing
# connection, and of every socket bound to port 0, from that range; when it picks a server's port
# before the server binds it, the server's bind fails until that connection ends. A reserved port
# is never picked automatically, while an explicit bind to it still works. The list holds for TCP
# and UDP and for IPv4 and IPv6 alike. ip_local_port_range itself is left as it is.
#
# Only the system's own listeners are listed here, not those of addons. Each port and its owner:
#   39292  tcp  hmipserver: VirtualDevices and its HTTP pages (HMServer.conf hmServerPort), loopback
#   42000  tcp  lighttpd: classic RPC over TLS for BidCos-Wired (hs485d), when switched on
#   42001  tcp  lighttpd: classic RPC over TLS for BidCos-RF (rfd), when switched on
#   42010  tcp  lighttpd: classic RPC over TLS for HmIP-RF (hmipserver), when switched on
#   43438  udp  hmipserver: the HmIP access points (HmIP-HAP, HmIPW-DRAP)
#   43439  udp  occulited: answers eQ-3's network discovery
#   49292  tcp  lighttpd: classic RPC over TLS for VirtualDevices (hmipserver), when switched on
#
# Not listed: hmipserver's second UDP socket, whose port the kernel picks anew at every start.
net.ipv4.ip_local_reserved_ports = 39292,42000-42001,42010,43438-43439,49292
