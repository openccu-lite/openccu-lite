# openccu-lite: /usr/local/etc belongs to root before anything below it is handled.
#
# The userfs of an eQ-3 CCU3 has the directory owned by a build account's number. After a switch
# to openccu-lite the first boot's tmpfiles run then refused the path below it - "Detected unsafe
# path transition /usr/local/etc (owned by 108)" on the way to occulited's state directory -
# because the init step that makes the directory root's runs later in the boot. tmpfiles handles
# a parent before its children, whichever file names it, so this line settles the owner first.
# Mode and owner are the init step's own.
d /usr/local/etc 0755 root root -
